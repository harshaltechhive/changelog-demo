name: Auto Update Changelog on Merge to dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push updates back

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # Full history needed to scan commits

      - name: Generate Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6  # ← Fixed: use v6 (latest major)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: conventionalcommits  # Use this for feat/fix/etc. grouping
          output-file: CHANGELOG.md    # Appends/updates in this file
          skip-on-empty: true          # Don't fail if no new conventional commits
          skip-version-file: true      # No need to bump version in package.json
          skip-commit: true            # Don't auto-commit/tag here (we handle below)
          git-message: 'docs: update CHANGELOG.md [skip ci]'
          git-user-name: 'GitHub Actions'
          git-user-email: 'actions@github.com'

      - name: Commit updated CHANGELOG.md (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md after merge [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md