name: Auto Update Changelog on Merge to dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit back

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # Full history for commit scanning

      - name: Generate Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v7  # Latest stable
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional but useful:
          version-file: ''  # Skip if no package.json version bump needed
          output-file: CHANGELOG.md  # Appends/updates here
          preset: conventionalcommits  # Groups feat/fix/etc.
          skip-on-empty: true  # Don't fail if no changes
          git-message: 'docs: update CHANGELOG.md [skip ci]'
          git-user-name: 'GitHub Actions'
          git-user-email: 'actions@github.com'

      - name: Commit updated CHANGELOG.md (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md after merge [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md