name: Usage-Focused Changelog with Ollama (Free)

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  generate-usage-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Collect PR information
        id: pr-info
        run: |
          echo "TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "BODY=${{ github.event.pull_request.body || 'No description provided' }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

          # Fixed heredoc syntax
          echo "COMMITS<<COMMITS_EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} || echo "- No commits found"
          echo "" >> $GITHUB_OUTPUT
          echo "COMMITS_EOF" >> $GITHUB_OUTPUT

      - name: Setup Ollama & download model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &> ollama.log &
          sleep 20
          ollama pull phi3:mini || echo "Model pull failed but continuing..."

      - name: Generate user-friendly usage description
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.PR_NUMBER }}
          PR_TITLE: ${{ steps.pr-info.outputs.TITLE }}
          PR_AUTHOR: ${{ steps.pr-info.outputs.AUTHOR }}
        run: |
          ollama run kimi-k2.5 
          You are a friendly app writer creating simple, helpful release notes or \"What's new\" entries.

          From the PR title, description, and commit messages:
          - Write ONLY about what the user can now DO and HOW to use the new/improved feature.
          - Use simple, everyday language: \"You can now...\", \"This lets you...\", \"Go to ... and ...\", \"Click ... to ...\"
          - Make it welcoming and clear — like instructions in the app itself.
          - 3–6 sentences maximum.
          - Use markdown formatting.
          - Start directly with ### [Short Feature Name or Action] (example: ### Log In to Your Account)

          Do NOT mention:
          - Code, components, functions, state, validation, API, backend, frontend, React, TypeScript,
            commits, PR number (except in heading), implementation details, or any technical words.

          Example output style:
          ### Log In to Your Account
          You can now sign in using your email and password on the nice blue login screen. Just type your email, enter your password, and tap the Login button. Check \"Remember me\" if you want to stay signed in next time you open the app. Forgot your password? Click the link to reset it quickly.

          Input:
          PR title: ${{ env.PR_TITLE }}
          PR description: ${{ steps.pr-info.outputs.BODY }}
          Commits:
          ${{ steps.pr-info.outputs.COMMITS }}
          " > usage-description.md

      - name: Append generated text to CHANGELOG.md
        run: |
          {
            echo ""
            echo "## PR #${{ steps.pr-info.outputs.PR_NUMBER }}: ${{ steps.pr-info.outputs.TITLE }} (@${{ steps.pr-info.outputs.AUTHOR }})"
            echo ""
            cat usage-description.md
            echo ""
            echo "---"
            echo ""
          } >> CHANGELOG.md

      - name: Commit the updated changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: add user-friendly usage changelog for PR #${{ steps.pr-info.outputs.PR_NUMBER }} [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md