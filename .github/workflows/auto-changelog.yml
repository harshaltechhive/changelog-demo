name: Usage-Focused Changelog with Ollama (Cached & Free)

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  generate-usage-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # ────────────────────────────────────────────────
      # Collect PR info (title, body, author, commits)
      # ────────────────────────────────────────────────
      - name: Collect PR information
        id: pr-info
        run: |
          echo "TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "BODY=${{ github.event.pull_request.body || 'No description provided' }}" >> $GITHUB_OUTPUT
          echo "AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

          echo "COMMITS<<COMMITS_EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%an)" \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} || echo "- No commits found"
          echo "" >> $GITHUB_OUTPUT
          echo "COMMITS_EOF" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # Cache Ollama + models (big speedup after first run)
      # ────────────────────────────────────────────────
      - name: Cache Ollama binary & models
        uses: actions/cache@v4
        id: cache-ollama
        with:
          path: |
            ~/.ollama
            /usr/local/bin/ollama
          key: ollama-cache-v3-${{ runner.os }}-llama3.2-3b-phi3-mini
          restore-keys: ollama-cache-v3-${{ runner.os }}-

      # ────────────────────────────────────────────────
      # Install Ollama only if cache was missed
      # ────────────────────────────────────────────────
      - name: Install Ollama (only on cache miss)
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # ────────────────────────────────────────────────
      # Start server + ensure model is available
      # ────────────────────────────────────────────────
      - name: Prepare Ollama server and model
        run: |
          echo "Starting Ollama server..."
          ollama serve &> ollama.log &
          sleep 30   # More time on first run or slow runners

          # Debug: is server alive?
          ps aux | grep ollama || echo "Warning: Ollama server not detected"

          # Preferred model
          MODEL="llama3.2:3b"
          if ! ollama list | grep -q "$MODEL"; then
            echo "Pulling $MODEL..."
            ollama pull $MODEL || echo "Pull failed for $MODEL"
          fi

          # Fallback model
          FALLBACK="phi3:mini"
          if ! ollama list | grep -q "$MODEL" && ! ollama list | grep -q "$FALLBACK"; then
            echo "Falling back to $FALLBACK..."
            ollama pull $FALLBACK || echo "Pull failed for $FALLBACK"
          fi

          # Show what's available
          echo "Available models:"
          ollama list

          # Last log lines for debugging
          echo "Recent Ollama logs:"
          tail -n 20 ollama.log || echo "No logs available"

      # ────────────────────────────────────────────────
      # Generate usage-focused description
      # ────────────────────────────────────────────────
      - name: Generate user-friendly usage description
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.PR_NUMBER }}
          PR_TITLE: ${{ steps.pr-info.outputs.TITLE }}
          PR_AUTHOR: ${{ steps.pr-info.outputs.AUTHOR }}
        run: |
          # Try preferred → fallback
          ollama run llama3.2:3b 2>/dev/null || ollama run phi3:mini 2>/dev/null <<'EOF' > usage-description.md
          You are a friendly app writer creating simple, helpful release notes or "What's new" entries.

          From the PR title, description, and commit messages:
          - Write ONLY about what the user can now DO and HOW to use the new/improved feature.
          - Use simple, everyday language: "You can now...", "This lets you...", "Go to ... and ...", "Click ... to ..."
          - Make it welcoming and clear — like instructions in the app itself.
          - 3–6 sentences maximum.
          - Use markdown formatting.
          - Start directly with ### [Short Feature Name or Action] (example: ### Log In to Your Account)

          Do NOT mention:
          - Code, components, functions, state, validation, API, backend, frontend, React, TypeScript,
            commits, PR number (except in heading), implementation details, or any technical words.

          Example output style:
          ### Log In to Your Account
          You can now sign in using your email and password on the nice blue login screen. Just type your email, enter your password, and tap the Login button. Check "Remember me" if you want to stay signed in next time you open the app. Forgot your password? Click the link to reset it quickly.

          Input:
          PR title: ${{ env.PR_TITLE }}
          PR description: ${{ steps.pr-info.outputs.BODY }}
          Commits:
          ${{ steps.pr-info.outputs.COMMITS }}

          If you have almost no useful information and cannot create a meaningful entry, output only:
          ### Minor update
          A small improvement was made. Check the code or ask the developer for details.
          EOF

      # ────────────────────────────────────────────────
      # Append to CHANGELOG.md with fallback
      # ────────────────────────────────────────────────
      - name: Append generated text to CHANGELOG.md
        run: |
          DESCRIPTION=$(cat usage-description.md || echo "")

          if [ -z "$DESCRIPTION" ] || [[ "$DESCRIPTION" =~ "No description generated" ]]; then
            DESCRIPTION="### Minor update\nA small improvement was made to the app. Check the code or ask the developer for details."
          fi

          {
            echo ""
            echo "## PR #${{ steps.pr-info.outputs.PR_NUMBER }}: ${{ steps.pr-info.outputs.TITLE }} (@${{ steps.pr-info.outputs.AUTHOR }})"
            echo ""
            echo "$DESCRIPTION"
            echo ""
            echo "---"
            echo ""
          } >> CHANGELOG.md

      # ────────────────────────────────────────────────
      # Commit the changelog
      # ────────────────────────────────────────────────
      - name: Commit the updated changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: add user-friendly usage changelog for PR #${{ steps.pr-info.outputs.PR_NUMBER }} [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md