name: Free AI Changelog with Ollama

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  ai-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}
          echo "DIFF<<EOF" >> $GITHUB_OUTPUT
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &> ollama.log &
          sleep 15  # Wait for server startup
          ollama pull phi3:mini   # Small & fast free model (~2GB, good for code)
          # Alternative: ollama pull llama3.1:8b if you want stronger but slower

      - name: Generate changelog entry with Ollama
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Limit diff size (phi3 handles ~8k-12k tokens well)
          echo "${{ steps.diff.outputs.DIFF }}" | head -c 12000 > diff.txt

          # Prompt Ollama
          ollama run phi3:mini "
          You are a senior React/TypeScript developer.
          Review this code diff from a merged PR.
          Write a short, professional changelog entry (3-7 sentences).
          Describe the real functionality added/changed/impact.
          Focus on: components, features, UX, security, state/routing/API.
          Ignore formatting/comments/tests unless meaningful.
          Use markdown. Start with ### Added/Improved [Feature]

          PR #${PR_NUMBER}: $$   {PR_TITLE} by @   $${PR_AUTHOR}

          Diff:
          $(cat diff.txt)
          " > description.md

      - name: Append to CHANGELOG.md
        run: |
          echo "" >> CHANGELOG.md
          echo "## PR #${{ env.PR_NUMBER }}: $$   {{ env.PR_TITLE }} (@   $${{ env.PR_AUTHOR }})" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          cat description.md >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md

      - name: Commit changelog update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Ollama AI changelog entry for PR #${{ github.event.pull_request.number }} [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md