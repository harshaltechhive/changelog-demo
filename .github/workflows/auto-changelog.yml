name: Auto Update Changelog on Merge to dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # full history

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v7  # latest version
        with:
          github-token: ${{ secrets.github_token }}
          version-file: package.json          # optional: if you have package.json with version
          git-message: 'chore(release): {{currentTag}}'
          git-user-name: 'GitHub Actions'
          git-user-email: 'actions@github.com'
          output-file: CHANGELOG.md           # appends to this file
          preset: conventionalcommits         # groups feat/fix/etc.

      - name: Commit updated CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md [skip ci]"
          branch: dev
          file_pattern: CHANGELOG.md